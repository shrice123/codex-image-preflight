name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Build and test the Windows packages
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python build_windows.py dist
          if ($LASTEXITCODE -ne 0) { throw 'Build or executable self-test failed.' }
      - name: Publish the verified files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName,isDraft --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed.' }
          $existing = $releases | ConvertFrom-Json | Where-Object tagName -eq $tag
          if (-not $existing) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Codex Image Prep $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed.' }
          } elseif (-not $existing.isDraft) {
            throw "Release $tag is already published. Use a new tag to publish a new build."
          }
          $notes = @'
          下载 **Codex-Image-Prep-Windows-x64.exe** 后双击启动。适用于 Windows x64 和 Codex 桌面客户端。无需安装 Python，也无需解压 EXE。再次双击可停止。

          ZIP 内含同一 EXE、使用说明和第三方许可文件。SHA256SUMS.txt 记录两个下载文件的校验值。
          '@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release upload $tag dist/Codex-Image-Prep-Windows-x64.exe dist/Codex-Image-Prep-Windows-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
